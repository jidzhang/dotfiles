# ============================================================
# 优化的 tmux 配置 (tmux 3.4+)
# 前缀键: Ctrl-t（C-a 是 shell 行首，C-b 留给 wezterm leader）| 鼠标: 全开
# 生效: tmux source ~/.tmux.conf 或 <prefix> + r
# ============================================================

# ---------- 1. 前缀键 Ctrl-b ----------
unbind C-a
unbind C-b
unbind C-t
set -g prefix C-t
bind C-t send-prefix          # 连按两次 Ctrl-t 向程序发送 Ctrl-t 本身

# ---------- 2. 鼠标全功能 ----------
set -g mouse on
# 说明: mouse on 后已包含
#  - 单击选择 pane / window
#  - 拖动边框调整 pane 大小
#  - 滚轮滚动进入 copy-mode
#  - 拖选复制 (松开自动进 tmux buffer)
# 下面两行让滚轮体验更顺滑:
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# 鼠标拖选后自动复制到系统剪贴板 (按优先级尝试,都不存在则只存 tmux buffer)
# Linux(X11): 需要 xclip 或 xsel; Wayland: 需要 wl-copy
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "if command -v xclip >/dev/null; then xclip -selection clipboard -in; elif command -v xsel >/dev/null; then xsel -i -b; elif command -v wl-copy >/dev/null; then wl-copy; else cat >/dev/null; fi"
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "if command -v xclip >/dev/null; then xclip -selection clipboard -in; elif command -v xsel >/dev/null; then xsel -i -b; elif command -v wl-copy >/dev/null; then wl-copy; else cat >/dev/null; fi"

# ---------- 3. 基础体验优化 ----------
set -g history-limit 50000           # 回滚行数
set -sg escape-time 10               # ESC 延迟, vim 体验关键
set -g focus-events on               # 让 vim/neovim 自动 Reload 等事件生效
set -g aggressive-resize on          # 多客户端时窗口尺寸更合理
set -g detach-on-destroy off         # 关闭最后一个 pane 时跳到其他 session,不直接退出
set -g renumber-windows on           # 关窗口后自动重排编号
set -g base-index 1                  # 窗口编号从 1 开始
setw -g pane-base-index 1            # pane 编号从 1 开始
set -g display-panes-time 1500       # <prefix> + q 显示 pane 编号时长
set -g display-time 1500
set -g status-interval 5             # 状态栏刷新间隔

# 真彩色 + 256色
set -g default-terminal "tmux-256color"
set -g terminal-overrides "xterm-256color:Tc,xterm-kitty:Tc,alacritty:Tc,ghostty:Tc,wezterm:Tc"
# tmux 3.2+ 新写法:告诉 tmux 外层终端支持 RGB 真彩色(与上面 Tc 二选一即可,这里两个都写最稳)
set -ga terminal-features ",xterm-256color:RGB,xterm-kitty:RGB,alacritty:RGB,ghostty:RGB,wezterm:RGB"
# 让外层 COLORTERM=truecolor 在 attach 时能透传进来(新 attach 生效)
set -ga update-environment " COLORTERM"

# ---------- 4. 按键习惯 ----------
setw -g mode-keys vi                 # copy-mode 用 vi 键
set -g status-keys vi

# r 一键重载配置
unbind r
bind r source-file ~/.tmux.conf \; display "✓ tmux 配置已重载"
bind R source-file ~/.tmux.conf \; display "✓ tmux 配置已重载"  # 兼容旧键

# 分屏更直观: | 垂直, - 水平, 新 pane 继承当前目录
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 新窗口继承当前目录
bind c new-window -c "#{pane_current_path}"

# Vim 风格 pane 跳转 (prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt + 方向键免前缀切换 pane (鼠标之外的键盘快捷方式)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift + 方向键免前缀切换 window
bind -n S-Left previous-window
bind -n S-Right next-window

# prefix + HJKL 大步调整 pane (可重复按, -r 表示可连发)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---------- 5. copy-mode (vi 风格,配合鼠标) ----------
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
# y 直接进系统剪贴板 (复用上面的工具链)
bind -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel "if command -v xclip >/dev/null; then xclip -selection clipboard -in; elif command -v xsel >/dev/null; then xsel -i -b; elif command -v wl-copy >/dev/null; then wl-copy; else cat >/dev/null; fi"

# ---------- 6. 状态栏美化 ----------
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 120
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] #S #[bg=#1e1e2e,fg=#89b4fa] "
set -g status-right "#[fg=#6c7086]#{?client_prefix,#[bg=#f38ba8]#[fg=#11111b] PREFIX #[bg=#1e1e2e]#[fg=#f38ba8],} %Y-%m-%d %H:%M #[fg=#45475a]│#[fg=#a6e3a1] #h "

setw -g window-status-separator " "
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[bg=#45475a,fg=#cdd6f4,bold] #I:#W "
setw -g window-status-current-style "bg=#45475a"
setw -g pane-border-style "fg=#45475a"
setw -g pane-active-border-style "fg=#89b4fa"

# activity 提醒
setw -g monitor-activity on
set -g visual-activity off
